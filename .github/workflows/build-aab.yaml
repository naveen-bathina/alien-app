name: Build AAB and Publish to GHCR

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      flavor:
        description: 'Flavor to build'
        required: true
        default: 'production'
        type: choice
        options:
          - production
          - staging
          - development

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: 'gradle'

      - name: Generate Debug Keystore for Unsigned CI Build
        run: |
          mkdir -p ~/.android ~/.config/.android
          keytool -genkey -v -keystore ~/.android/debug.keystore \
            -storepass android -alias androiddebugkey -keypass android \
            -keyalg RSA -keysize 2048 -validity 10000 \
            -dname "CN=Android Debug,O=Android,C=US"
          cp ~/.android/debug.keystore ~/.config/.android/debug.keystore

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.35.6'
          channel: 'stable'
          cache: true

      - name: Restore Firebase Config (from GitHub Secrets)
        env:
          GOOGLE_SERVICES_JSON_BASE64: ${{ secrets.GOOGLE_SERVICES_JSON_BASE64 }}
          FIREBASE_OPTIONS_DART_BASE64: ${{ secrets.FIREBASE_OPTIONS_DART_BASE64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_BASE64" ]; then
            echo "$GOOGLE_SERVICES_JSON_BASE64" | base64 -d > android/app/google-services.json
          fi
          if [ -n "$FIREBASE_OPTIONS_DART_BASE64" ]; then
            echo "$FIREBASE_OPTIONS_DART_BASE64" | base64 -d > lib/firebase_options.dart
          fi

      - name: Restore Release Keystore (from GitHub Secrets)
        if: env.ANDROID_KEYSTORE_BASE64 != ''
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          mkdir -p android/app/keystore
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > android/app/keystore/release.keystore

      - name: Install dependencies
        run: flutter pub get

      - name: Build Android App Bundle (AAB)
        env:
          FLAVOR: ${{ inputs.flavor || 'production' }}
          ANDROID_KEYSTORE_PATH: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' && 'keystore/release.keystore' || null }}
          ANDROID_KEYSTORE_ALIAS: ${{ secrets.ANDROID_KEYSTORE_ALIAS }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PRIVATE_KEY_PASSWORD }}
        run: |
          # If no google-services.json was provided via secrets, create a placeholder so gradle build doesn't halt
          if [ ! -f "android/app/google-services.json" ]; then
            echo "Creating dummy google-services.json for build verification..."
            cat << 'EOF' > android/app/google-services.json
          {
            "project_info": { "project_number": "000000000000", "project_id": "placeholder" },
            "client": [
              { "client_info": { "mobilesdk_app_id": "1:000:android:000", "android_client_info": { "package_name": "com.obi.myalien.myalien" } }, "api_key": [{ "current_key": "AIzaSyDummyKeyPlaceholder000000000000" }] },
              { "client_info": { "mobilesdk_app_id": "1:000:android:000", "android_client_info": { "package_name": "com.obi.myalien.myalien.dev" } }, "api_key": [{ "current_key": "AIzaSyDummyKeyPlaceholder000000000000" }] },
              { "client_info": { "mobilesdk_app_id": "1:000:android:000", "android_client_info": { "package_name": "com.obi.myalien.myalien.stg" } }, "api_key": [{ "current_key": "AIzaSyDummyKeyPlaceholder000000000000" }] }
            ]
          }
          EOF
          fi

          # If no firebase_options.dart was provided via secrets, create stub for compilation
          if [ ! -f "lib/firebase_options.dart" ]; then
            echo "Creating stub lib/firebase_options.dart for compilation..."
            cat << 'EOF' > lib/firebase_options.dart
          import 'package:firebase_core/firebase_core.dart' show FirebaseOptions;
          import 'package:flutter/foundation.dart' show defaultTargetPlatform, TargetPlatform, kIsWeb;

          class DefaultFirebaseOptions {
            static FirebaseOptions get currentPlatform => android;
            static const FirebaseOptions android = FirebaseOptions(
              apiKey: 'AIzaSyDummyKeyPlaceholder000000000000',
              appId: '1:000:android:000',
              messagingSenderId: '000000000000',
              projectId: 'placeholder',
            );
          }
          EOF
          fi

          flutter build appbundle \
            --flavor "$FLAVOR" \
            -t "lib/main_${FLAVOR}.dart" \
            --android-skip-build-dependency-validation

      - name: Locate AAB output
        id: aab_path
        run: |
          AAB_FILE=$(find build/app/outputs/bundle -name "*.aab" | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "Error: No AAB file found!"
            exit 1
          fi
          echo "Found AAB at: $AAB_FILE"
          echo "file=$AAB_FILE" >> "$GITHUB_OUTPUT"
          
          # Package tag / version for GHCR
          VERSION="${GITHUB_REF_NAME:-latest}"
          SAFE_TAG=$(echo "$VERSION" | tr '/' '-')
          echo "tag=$SAFE_TAG" >> "$GITHUB_OUTPUT"
          
          # Repository name in lowercase for GHCR
          IMAGE_NAME="ghcr.io/${{ github.repository_owner }}/alien-app-aab"
          echo "image=$(echo "$IMAGE_NAME" | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"

      - name: Upload AAB as GitHub Workflow Artifact
        uses: actions/upload-artifact@v7
        with:
          name: app-${{ inputs.flavor || 'production' }}-release-aab
          path: ${{ steps.aab_path.outputs.file }}
          retention-days: 30

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Package and Push AAB to GHCR (OCI Image / Artifact)
        run: |
          AAB_FILE="${{ steps.aab_path.outputs.file }}"
          DEST_IMAGE="${{ steps.aab_path.outputs.image }}:${{ steps.aab_path.outputs.tag }}"
          
          WORKDIR=$(mktemp -d)
          cp "$AAB_FILE" "$WORKDIR/app-release.aab"
          
          cat <<EOF > "$WORKDIR/Dockerfile"
          FROM scratch
          LABEL org.opencontainers.image.title="MyAlien Android App Bundle"
          LABEL org.opencontainers.image.description="Android App Bundle (AAB) for MyAlien"
          LABEL org.opencontainers.image.source="https://github.com/${{ github.repository }}"
          COPY app-release.aab /app-release.aab
          EOF
          
          docker build -t "$DEST_IMAGE" "$WORKDIR"
          docker push "$DEST_IMAGE"
          
          # If pushed from main, also tag as latest
          if [ "${{ github.ref_name }}" = "main" ]; then
            LATEST_IMAGE="${{ steps.aab_path.outputs.image }}:latest"
            docker tag "$DEST_IMAGE" "$LATEST_IMAGE"
            docker push "$LATEST_IMAGE"
          fi
